<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { display: block; width: 100%; height: 100%; object-fit: contain; }
  #snd {
    position: fixed; right: 14px; bottom: 14px; width: 40px; height: 40px;
    border: 0; border-radius: 50%; background: rgba(255,255,255,.12); color: #fff;
    font-size: 17px; line-height: 1; cursor: pointer; opacity: .3; transition: opacity .2s;
  }
  #snd:hover { opacity: 1; }
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<button id="snd" title="声音">🔇</button>
<script>
// 这块屏幕只是块显示屏：放什么、放到哪、放还是停，全看服务端的时间线。
// 后台在播，谁什么时候进来都从当前进度接上，跟电影院一样。
// 浏览器不允许没交互就带声音播放，所以先静音自动开始，声音交给右下角。
const v = document.getElementById('v');
const snd = document.getElementById('snd');
const OFF = 2.5;      // 落后超过这么多秒才追，别在小抖动上反复 seek
let epoch = null;

snd.addEventListener('click', () => {
  v.muted = !v.muted;
  snd.textContent = v.muted ? '🔇' : '🔊';
});

// 字幕约定：跟片源同名的 .vtt（movie.mp4 → movie.vtt），由服务端的 /subs
// 取回来转一手 —— 同源，省得去动 OSS 的 CORS 配置。
// 有没有这个文件事先不知道：先挂上去，取到了就显示；404 的话 track 会报
// 错，自己撤掉，观众什么都看不见，也就当没有字幕。
function loadSubs(videoUrl) {
  // 换片不能只靠 load()：它清的是片子自带的内嵌轨，这种 <track> 挂上去的
  // 外挂轨会留在原地 —— 不主动清，上一部的字幕会跟着播到下一部。
  v.querySelectorAll('track').forEach(t => t.remove());
  const track = document.createElement('track');
  track.kind = 'subtitles';
  track.label = '字幕';
  track.srclang = 'zh';
  track.src = 'subs?u=' + encodeURIComponent(videoUrl);
  track.addEventListener('error', () => track.remove());
  v.appendChild(track);
  track.track.mode = 'showing';   // 动态建的轨默认禁用，得手动点开
}

async function tick() {
  let s;
  try { s = await (await fetch('status')).json(); } catch { return; }
  if (!s.url) return;

  if (s.epoch !== epoch) {                  // 换片：重载，直接落到当前进度
    epoch = s.epoch;
    v.addEventListener('loadedmetadata', () => {
      v.currentTime = s.pos;
      if (s.playing) v.play().catch(() => {});
    }, { once: true });
    v.src = s.url;
    v.load();    // 重开同一部片子时 src 没变，浏览器不会自己重载，得推一把
    loadSubs(s.url);   // 排在 load() 后面，免得被重载流程打断
    return;
  }

  // 对表：慢了就跳过去，电影院不等迟到的人。
  if (!v.seeking && v.readyState >= 2 && Math.abs(v.currentTime - s.pos) > OFF) {
    v.currentTime = s.pos;
  }
  if (s.playing ? v.paused : !v.paused) {
    s.playing ? v.play().catch(() => {}) : v.pause();
  }
}

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
